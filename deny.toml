# cargo-deny: license, advisory and source checks. Run: `cargo deny check`.
# DocumentKit is GPL-3.0-or-later; every dependency must be compatible.

[graph]
all-features = false

[advisories]
yanked = "deny"
# Fail on unmaintained crates we depend on directly. Transitive ones (e.g. the GTK3
# bindings under Dioxus/wry on Linux) are upstream's to replace; vulnerabilities
# still fail the check at any depth.
unmaintained = "workspace"

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "CDLA-Permissive-2.0", # webpki-roots (Mozilla CA list, via ureq)
  "BSL-1.0",
  "0BSD",
  "GPL-3.0-or-later",
  "LGPL-2.1-or-later",
  "LGPL-3.0-or-later",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
